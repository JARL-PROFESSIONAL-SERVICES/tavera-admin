<div
  class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fadeIn"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-lg bg-[var(--surface)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    <!-- MODAL HEADER -->
    <div class="px-6 py-4 border-b border-[var(--border)] flex items-center justify-between bg-[var(--surface-muted)]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/20 flex items-center justify-center">
          <ng-icon name="lucideAlertTriangle" size="20"></ng-icon>
        </div>
        <div>
          <h3 class="text-base font-bold text-[var(--foreground)]">Ajuste Operativo de Inventario</h3>
          <p class="text-xs text-[var(--muted-foreground)]">Impacto directo e inmutable en el Kardex físico.</p>
        </div>
      </div>

      <button
        type="button"
        (click)="cancel.emit()"
        class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
      >
        <ng-icon name="lucideX" size="18"></ng-icon>
      </button>
    </div>

    <!-- MODAL BODY -->
    <div class="p-6 space-y-4 text-xs">
      <!-- 1. PRODUCT SELECTOR -->
      <div class="space-y-1.5">
        <label class="block font-semibold text-[var(--foreground)]">Artículo a Ajustar *</label>
        <select
          [ngModel]="selectedProductId()"
          (ngModelChange)="onProductChange($event)"
          class="w-full px-3.5 py-2.5 bg-[var(--surface-muted)] border border-[var(--border)] rounded-lg text-xs font-semibold text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--brand)]"
        >
          @for (prod of products; track prod.id) {
            <option [value]="prod.id">
              {{ prod.name }} ({{ prod.sku }}) — Stock Actual: {{ prod.stockQuantity }} {{ prod.baseUnit?.code ?? 'PZA' }}
            </option>
          }
        </select>
      </div>

      <!-- 2. MOVEMENT TYPE SELECTOR -->
      <div class="space-y-1.5">
        <label class="block font-semibold text-[var(--foreground)]">Tipo de Ajuste Físico *</label>
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            (click)="movementType.set('ADJUSTMENT_IN')"
            class="p-2.5 rounded-lg border text-left transition-colors"
            [ngClass]="{
              'bg-emerald-500/10 border-emerald-500 text-emerald-800 dark:text-emerald-300 font-semibold': movementType() === 'ADJUSTMENT_IN',
              'bg-[var(--surface-muted)] border-[var(--border)] text-[var(--foreground)]': movementType() !== 'ADJUSTMENT_IN'
            }"
          >
            <div class="font-bold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              Entrada (+ Stock)
            </div>
            <p class="text-[10px] text-[var(--muted-foreground)] mt-0.5">Sobrante o mercancía recuperada</p>
          </button>

          <button
            type="button"
            (click)="movementType.set('ADJUSTMENT_OUT')"
            class="p-2.5 rounded-lg border text-left transition-colors"
            [ngClass]="{
              'bg-amber-500/10 border-amber-500 text-amber-800 dark:text-amber-300 font-semibold': movementType() === 'ADJUSTMENT_OUT',
              'bg-[var(--surface-muted)] border-[var(--border)] text-[var(--foreground)]': movementType() !== 'ADJUSTMENT_OUT'
            }"
          >
            <div class="font-bold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              Salida (- Stock)
            </div>
            <p class="text-[10px] text-[var(--muted-foreground)] mt-0.5">Faltante por arqueo físico</p>
          </button>

          <button
            type="button"
            (click)="movementType.set('WASTE_OUT')"
            class="p-2.5 rounded-lg border text-left transition-colors"
            [ngClass]="{
              'bg-red-500/10 border-red-500 text-red-800 dark:text-red-300 font-semibold': movementType() === 'WASTE_OUT',
              'bg-[var(--surface-muted)] border-[var(--border)] text-[var(--foreground)]': movementType() !== 'WASTE_OUT'
            }"
          >
            <div class="font-bold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-red-500"></span>
              Merma (- Stock)
            </div>
            <p class="text-[10px] text-[var(--muted-foreground)] mt-0.5">Caducidad, rotura o daño</p>
          </button>

          <button
            type="button"
            (click)="movementType.set('INITIAL_LOAD')"
            class="p-2.5 rounded-lg border text-left transition-colors"
            [ngClass]="{
              'bg-blue-500/10 border-blue-500 text-blue-800 dark:text-blue-300 font-semibold': movementType() === 'INITIAL_LOAD',
              'bg-[var(--surface-muted)] border-[var(--border)] text-[var(--foreground)]': movementType() !== 'INITIAL_LOAD'
            }"
          >
            <div class="font-bold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              Carga Inicial
            </div>
            <p class="text-[10px] text-[var(--muted-foreground)] mt-0.5">Conteo de apertura</p>
          </button>
        </div>
      </div>

      <!-- 3. QUANTITY & UNIT COST -->
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1.5">
          <label class="block font-semibold text-[var(--foreground)]">Cantidad en Unidades Base *</label>
          <input
            type="number"
            min="0.0001"
            step="0.0001"
            [ngModel]="quantity()"
            (ngModelChange)="quantity.set($event)"
            placeholder="Ej. 12"
            class="w-full px-3.5 py-2 bg-[var(--surface-muted)] border border-[var(--border)] rounded-lg text-sm font-mono font-bold text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--brand)]"
          />
        </div>

        <div class="space-y-1.5">
          <label class="block font-semibold text-[var(--foreground)]">Costo unitario ($), opcional</label>
          <input
            type="number"
            min="0.0001"
            step="0.0001"
            [ngModel]="unitCost()"
            (ngModelChange)="unitCost.set($event)"
            placeholder="Sin costo aplicado"
            class="w-full px-3.5 py-2 bg-[var(--surface-muted)] border border-[var(--border)] rounded-lg text-sm font-mono text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--brand)]"
          />
        </div>
      </div>

      <!-- 4. REASON -->
      <div class="space-y-1.5">
        <label class="block font-semibold text-[var(--foreground)]">Motivo Justificatorio (Auditable) *</label>
        <textarea
          rows="2"
          [ngModel]="reason()"
          (ngModelChange)="reason.set($event)"
          placeholder="Especifique la causa del ajuste para el historial de auditoría..."
          class="w-full px-3.5 py-2 bg-[var(--surface-muted)] border border-[var(--border)] rounded-lg text-xs text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--brand)]"
        ></textarea>
      </div>

      <!-- PROJECTION CARD -->
      <div class="p-3.5 rounded-xl bg-[var(--surface-muted)] border border-[var(--border)] space-y-2">
        <div class="text-[11px] font-bold text-[var(--muted-foreground)]">Proyección de Inventario:</div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)]">
            <span class="text-[10px] text-[var(--muted-foreground)]">Stock Antes</span>
            <div class="font-mono font-bold text-sm text-[var(--foreground)] mt-0.5">
              {{ currentStock() }}
            </div>
          </div>

          <div class="p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)]">
            <span class="text-[10px] text-[var(--muted-foreground)]">Variación</span>
            <div class="font-mono font-bold text-sm mt-0.5" [ngClass]="isReduction() ? 'text-red-500' : 'text-emerald-600'">
              {{ isReduction() ? '-' + quantity() : '+' + quantity() }}
            </div>
          </div>

          <div class="p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)]">
            <span class="text-[10px] text-[var(--muted-foreground)]">Stock Después</span>
            <div class="font-mono font-bold text-sm text-[var(--foreground)] mt-0.5">
              {{ projectedStock() }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL FOOTER -->
    <div class="px-6 py-4 border-t border-[var(--border)] bg-[var(--surface-muted)] flex items-center justify-end gap-2">
      <button
        type="button"
        (click)="cancel.emit()"
        [disabled]="isSaving"
        class="px-4 py-2 rounded-lg bg-[var(--surface)] border border-[var(--border)] hover:bg-[var(--surface-muted)] text-[var(--foreground)] text-xs font-semibold"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="submitAdjustment()"
        [disabled]="isSaving || !isValid()"
        class="px-5 py-2 bg-[var(--brand-solid)] text-white text-xs font-semibold rounded-lg hover:opacity-95 disabled:opacity-50 flex items-center gap-1.5"
      >
        @if (isSaving) {
          <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>Aplicando...</span>
        } @else {
          <ng-icon name="lucideCheck" size="14"></ng-icon>
          <span>Confirmar Movimiento en Kardex</span>
        }
      </button>
    </div>
  </div>
</div>
